spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/careflow}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

careflow:
  jwt-secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
  groq-api-key: ${GROQ_API_KEY:}
  groq-model: ${GROQ_MODEL:openai/gpt-oss-20b}

  notifications:
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@careflow.local}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/oauth/callback}
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:}
  from-name: CareFlow
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
