spring:
  application:
    name: careflow-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/careflow}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

careflow:
  jwt-secret: ${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
  groq-api-key: ${GROQ_API_KEY:}
  groq-model: ${GROQ_MODEL:llama-3.1-70b-versatile}
  sendgrid-api-key: ${SENDGRID_API_KEY:}
  sendgrid-from: ${SENDGRID_FROM_EMAIL:no-reply@careflow.local}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  google-redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/oauth/callback}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
